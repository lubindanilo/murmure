name: build

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Package.*", "Scripts/**", "Resources/**", "Tests/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      llms:
        description: "LLM à comparer (ids séparés par des virgules, vide = aucun)"
        default: ""
      tones:
        description: "Tons à tester (mail,chat,prompt ; vide = aucun)"
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Environnement
        run: |
          sw_vers; uname -m; swift --version; xcodebuild -version
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal" || true

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-v1
          restore-keys: spm-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Murmure/Models
          key: models-v1-${{ github.run_id }}
          restore-keys: models-v1-

      - name: Certificat de signature
        env:
          CERT_P12: ${{ secrets.MURMURE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MURMURE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "Pas de certificat : signature ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH=$(security find-identity -p codesigning "$KC" | awk '/\)/{print $2; exit}')
          if [ -z "$HASH" ]; then
            HASH=$(security find-certificate -a -Z -c "Murmure" "$KC" | awk '/SHA-1/{print $3; exit}')
          fi
          echo "Identité : $HASH"
          echo "MURMURE_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "MURMURE_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Compilation
        run: Scripts/build-app.sh release

      - name: Vérification du bundle
        run: |
          APP=build/Murmure.app
          codesign -dvvv "$APP" 2>&1 | grep -E "Identifier|Authority|Signature|TeamIdentifier|flags"
          codesign -d -r- "$APP" 2>&1 | tail -1
          codesign --verify --deep --strict "$APP" && echo "signature OK"
          otool -L "$APP/Contents/MacOS/Murmure" | grep -i llama
          plutil -lint "$APP/Contents/Info.plist"

      - name: Audio de test
        run: |
          VOICE=$(say -v '?' | awk '/fr_FR/ && /Thomas|Amélie|Amelie|Audrey|Aurélie/{print $1; exit}')
          [ -n "$VOICE" ] || VOICE=$(say -v '?' | awk '/fr_FR/{print $1; exit}')
          echo "Voix : ${VOICE:-défaut}"
          say ${VOICE:+-v "$VOICE"} -o "$RUNNER_TEMP/fr.aiff" "Bonjour, je voudrais décaler la réunion de demain à quinze heures, parce que Louis ne peut pas le matin. Tu peux prévenir Axel ?"
          afconvert -f WAVE -d LEI16@16000 "$RUNNER_TEMP/fr.aiff" Tests/fixtures/fr.wav
          ls -la Tests/fixtures/fr.wav

      - name: Transcription (Parakeet Ultra) + nettoyage
        run: |
          build/Murmure.app/Contents/MacOS/Murmure --selftest Tests/fixtures/fr.wav --model parakeet-ultra --llm qwen2.5-1.5b 2>&1 \
            | grep -vE "^(llama|load|print_info|ggml|graph|llm_load|common)" | tee selftest.txt
          grep -q "^Brut : ." selftest.txt
          grep -q "^Nettoyé : ." selftest.txt
          grep -q "^IA : ." selftest.txt

      - name: Banc Murmure Cleanup 1
        run: |
          build/Murmure.app/Contents/MacOS/Murmure --cleanuptest Tests/cleanup-bench/eval.jsonl 2>&1 \
            | grep -vE "^(llama|load|print_info|ggml|graph|llm_load|common)" | tee cleanup.txt
          grep -q "^Identiques à la référence" cleanup.txt

      - name: Licence (serveur de production)
        run: build/Murmure.app/Contents/MacOS/Murmure --licensetest

      - name: Comparatif LLM
        if: ${{ github.event.inputs.llms != '' }}
        run: |
          build/Murmure.app/Contents/MacOS/Murmure --llmtest Tests/fixtures/dictees-brutes.txt --llm "${{ github.event.inputs.llms }}" 2>&1 \
            | grep -E "^(=====|#|Téléchargement|Échec|LLM)" | tee llm-compare.txt

      - name: Test des tons
        if: ${{ github.event.inputs.tones != '' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          for tone in $(echo "${{ github.event.inputs.tones }}" | tr ',' ' '); do
            perl -e 'alarm shift; exec @ARGV' 360 build/Murmure.app/Contents/MacOS/Murmure --llmtest Tests/fixtures/dictees-tons.txt --llm qwen2.5-1.5b --tone "$tone" 2>&1 \
              | grep -E "^(=====|#|Téléchargement|Échec|LLM)|garde-fou" | tee -a tones.txt
          done

      - name: Archive et DMG
        run: |
          ditto -c -k --keepParent build/Murmure.app build/Murmure.zip
          # DMG mis en page (flèche vers Applications) : Scripts/dmg/settings.py, sans piloter le Finder.
          python3 -m venv "$RUNNER_TEMP/dmg" && "$RUNNER_TEMP/dmg/bin/pip" install -q "dmgbuild==1.6.5"
          "$RUNNER_TEMP/dmg/bin/dmgbuild" -s Scripts/dmg/settings.py -D app=build/Murmure.app Murmure build/Murmure.dmg
          shasum -a 256 build/Murmure.zip build/Murmure.dmg

      - name: Test du script d'installation
        run: |
          python3 -m http.server 8765 --directory build >/dev/null 2>&1 &
          sleep 1
          sed 's#^URL=.*#URL="http://127.0.0.1:8765/Murmure.zip"#; s#^open .*#echo "(open ignoré en CI)"#' landing/install.sh > "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh"
          test -x /Applications/Murmure.app/Contents/MacOS/Murmure
          codesign --verify --deep --strict /Applications/Murmure.app && echo "installé et signé"

      - name: Captures d'écran
        continue-on-error: true
        run: |
          mkdir -p shots
          system_profiler SPDisplaysDataType | grep -i resolution || true
          shot() { name=$1; shift; open -n build/Murmure.app --args "$@"; sleep 7; screencapture -x "shots/$name.png"; pkill -x Murmure || true; sleep 2; }
          for s in 0 1 2 3 4 5; do shot "onboarding-$s" -hasCompletedOnboarding NO -demoStep $s; done
          for sec in general dictionary license; do shot "reglages-$sec" -hasCompletedOnboarding YES -demoSettings $sec; done
          for h in recording polishing done failed; do shot "hud-$h" -hasCompletedOnboarding YES -demoHUD $h; done
          shot "sombre-onboarding-3" -hasCompletedOnboarding NO -demoStep 3 -demoDark YES
          shot "sombre-onboarding-0" -hasCompletedOnboarding NO -demoStep 0 -demoDark YES
          shot "sombre-onboarding-5" -hasCompletedOnboarding NO -demoStep 5 -demoDark YES
          shot "sombre-reglages-general" -hasCompletedOnboarding YES -demoSettings general -demoDark YES
          shot "sombre-reglages-license" -hasCompletedOnboarding YES -demoSettings license -demoDark YES
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.sha }}
          path: shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: murmure-${{ github.sha }}
          path: |
            build/Murmure.zip
            build/Murmure.dmg
            selftest.txt
            cleanup.txt
            llm-compare.txt
            tones.txt
          if-no-files-found: ignore
