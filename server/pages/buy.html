<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmure, paiement</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfbfd; --fg:#1d1d1f; --muted:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --fg:#f5f5f7; --muted:#a1a1a6; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:440px; text-align:center; }
  h1 { font-size:32px; letter-spacing:-0.02em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:12px 28px; background:var(--fg); color:var(--bg); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Activer Murmure</h1>
  <p id="msg">Le paiement s'ouvre. Une fois terminé, Murmure s'active tout seul sur votre Mac.</p>
  <button id="open" type="button">Ouvrir le paiement</button>
</main>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
  const device = "{{device}}";
  if ("{{environment}}" !== "production") Paddle.Environment.set("sandbox");
  Paddle.Initialize({ token: "{{token}}" });
  function openCheckout() {
    Paddle.Checkout.open({
      items: [{ priceId: "{{price}}", quantity: 1 }],
      customData: device ? { device_id: device } : undefined,
      settings: { successUrl: "{{success}}", locale: "fr", displayMode: "overlay" }
    });
  }
  document.getElementById("open").addEventListener("click", openCheckout);
  if (!device) document.getElementById("msg").textContent = "Ouvrez ce lien depuis Murmure (Réglages, Licence) pour que l'achat s'associe à votre Mac.";
  openCheckout();
</script>
</body>
</html>
