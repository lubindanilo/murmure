# Seconde passe : reprise du point 400 de la première (train.yaml) sur les données v2
# (corpus élargi, « genre de » et mots de liaison gardés). Taux d'apprentissage plus bas.
#   python -m mlx_lm lora -c train-v2.yaml
model: base/qwen05
train: true
data: data-v2
fine_tune_type: full
optimizer: adamw
mask_prompt: true
num_layers: -1
batch_size: 8
iters: 400
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 400, 1.0e-6]
resume_adapter_file: runs/full-v1/0000400_adapters.safetensors
steps_per_report: 20
steps_per_eval: 100
val_batches: -1
save_every: 100
adapter_path: runs/full-v2
max_seq_length: 1024
grad_checkpoint: true
seed: 11
